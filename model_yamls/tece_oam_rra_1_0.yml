hyperparams:
  max_force: 0.02
  max_steps: 500
  ase_optimizer: FIRE
  cell_filter: FrechetCellFilter
  graph_construction_radius: 6.0
  max_neighbors: .inf
  epochs: 3
  batch: 512
  loss_weights:
    energy: 1
    force: 1
    stress: 1
  num_interaction_channel: 64
  num_product_channel: 256
  mmax: 4
  Lmax: 4
  lmax: 4
  l1l2: <=
  num_layers: 8
  correlation: 2

training_cost:
  Nvidia H20 GPUs: {amount: 32, hours: 240, cost: 7680}

requirements:
  torch: '>=2.8'
  tace: '>=0.2.0'

training_set: [OMat24, sAlex, MPtrj]

notes:
  Description: |
    This model is based on Atomic Cluster Expansion, Edge Cluster Expansion
    and Radial Rotary Attention.

